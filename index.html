<!-- 图片上传（GitHub Action 自动存图） -->
<h2>上传图片</h2>
<input type="file" id="upload" accept="image/*">
<button id="sendPic">上传</button>

<script>
document.getElementById("sendPic").onclick = async () => {
  const file = document.getElementById("upload").files[0];
  if (!file) return alert("请先选择图片！");

  const base64 = await fileToBase64(file);

  await fetch("https://api.github.com/repos/zoe20001001-cpu/yuck/dispatches", {
    method: "POST",
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer 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",   // 稍后替换
    },
    body: JSON.stringify({
      event_type: "upload_image",
      client_payload: {
        filename: file.name,
        content: base64
      }
    })
  });

  alert("上传成功！等待 GitHub 自动刷新。");
};

function fileToBase64(file) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = () => {
      res(reader.result.split(",")[1]);
    };
    reader.readAsDataURL(file);
  });
}
</script>

<!-- 上传图片模块结束 -->
</body>
<body>
  <!-- 留言板模块开始 -->

<h2>留言板</h2>

<div style="max-width:500px;margin-top:10px;">
  <textarea id="msgInput" placeholder="说点什么吧…" 
            style="width:100%;height:80px;padding:8px;"></textarea>
  <button id="sendMsgBtn" style="margin-top:6px;">提交留言</button>
</div>

<ul id="msgList" style="margin-top:16px; padding-left:20px;"></ul>

<script>
  const input = document.getElementById("msgInput");
  const btn = document.getElementById("sendMsgBtn");
  const list = document.getElementById("msgList");

  // 从 localStorage 读取历史留言
  const saved = JSON.parse(localStorage.getItem("messages") || "[]");
  saved.forEach(text => addMsg(text));

  // 点击提交
  btn.addEventListener("click", () => {
    const content = input.value.trim();
    if (!content) return alert("留言不能为空！");
    
    addMsg(content);
    saved.push(content);
    localStorage.setItem("messages", JSON.stringify(saved));

    input.value = "";
  });

  // 添加留言到列表
  function addMsg(text) {
    const li = document.createElement("li");
    li.textContent = text;
    li.style.margin = "6px 0";
    list.appendChild(li);
  }
</script>

<!-- 留言板模块结束 -->

</body>
